{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-8 text-slate-100">
    <h1 class="text-3xl font-bold mb-8">Theaters</h1>
    <form method="get" class="mb-8">
        <select name="city" onchange="this.form.submit()" class="bg-slate-800 text-white rounded p-2">
            <option value="">All Cities</option>
            {% for city in cities %}
                <option value="{{ city.slug }}" {% if city.slug == selected_city %}selected{% endif %}>{{ city.name }}</option>
            {% endfor %}
        </select>
    </form>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for theater in theaters %}
        <div class="bg-slate-800 rounded-lg overflow-hidden shadow-lg border border-slate-700">
            {% if theater.image %}
                <img src="{{ theater.image.url }}" alt="{{ theater.name }}" class="w-full h-48 object-cover">
            {% else %}
                <div class="w-full h-48 bg-slate-700 flex items-center justify-center">
                    <span class="text-slate-400">No Image</span>
                </div>
            {% endif %}
            <div class="p-6">
                <h2 class="text-xl font-bold mb-2">{{ theater.name }}</h2>
                <p class="text-slate-400 mb-2">{{ theater.city.name }}</p>
                <p class="text-slate-400 mb-4">{{ theater.screens.count }} Screens</p>
                <a href="{% url 'theaters:theater_detail' theater.slug %}" class="inline-block bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded">View Details</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
